<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Price Alerts Modal Test</title>
  <link rel="stylesheet" href="extension/css/popup.css">
</head>
<body>
  <div style="padding: 12px;">
    <button id="showModal" style="padding: 12px 24px; font-size: 16px;">Show Price Alerts Modal</button>
  </div>

  <!-- Price Alerts Modal - Compact Design -->
  <div id="alertsModal" class="modal-overlay" style="display: none;">
    <div class="modal-content alert-modal-compact">

      <!-- Header with current price -->
      <div class="alert-header-compact">
        <h3>Price Alerts 🔔</h3>
        <div class="alert-current-price">
          <span class="alert-price-label">Current:</span>
          <span id="alertCurrentPrice" class="alert-price-value">$114,553</span>
        </div>
      </div>

      <!-- Target Value Alert -->
      <div class="alert-row">
        <span class="alert-row-label">Target Value</span>
        <div class="alert-row-controls">
          <select id="alertTargetDirection" class="alert-select">
            <option value="above">Above</option>
            <option value="below">Below</option>
          </select>
          <div class="alert-input-group">
            <span class="alert-currency-symbol">$</span>
            <div class="alert-input-wrapper">
              <input type="number" id="alertTargetValue" placeholder="115000" class="alert-input" value="115000">
            </div>
          </div>
        </div>
      </div>

      <!-- Percentage Alert -->
      <div class="alert-row">
        <span class="alert-row-label">Percentage</span>
        <div class="alert-row-controls">
          <select id="alertPercentDirection" class="alert-select">
            <option value="above">Above</option>
            <option value="below">Below</option>
          </select>
          <div class="alert-input-group">
            <span class="alert-percent-symbol">%</span>
            <div class="alert-input-wrapper">
              <input type="number" id="alertPercentValue" placeholder="5" class="alert-input" value="5">
            </div>
          </div>
        </div>
      </div>

      <!-- Compact status badge -->
      <div id="alertStatus" class="alert-status-compact alert-active">✓ Alert active: Above $115,000 or +5%</div>

      <!-- Compact buttons with toggle on far right -->
      <div class="modal-buttons-compact">
        <button id="closeAlertsModalBtn" class="btn-text-compact">Close</button>
        <button id="saveAlertBtn" class="btn-primary-compact">Save Alert</button>
        <label class="toggle-switch-compact">
          <input type="checkbox" id="alertEnabled" checked>
          <span class="toggle-slider-compact"></span>
        </label>
      </div>

    </div>
  </div>

  <script>
    document.getElementById('showModal').addEventListener('click', () => {
      document.getElementById('alertsModal').style.display = 'flex';
    });

    document.getElementById('closeAlertsModalBtn').addEventListener('click', () => {
      document.getElementById('alertsModal').style.display = 'none';
    });
  </script>
</body>
</html>
